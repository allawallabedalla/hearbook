<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Faden – Prototyp</title>
<style>
  :root {
    --grund: #EEF0F3;
    --tinte: #1C2130;
    --tinte-leise: #5E6577;
    --faden: #3346A8;
    --knoten: #1C2130;
  }
  .nacht {
    --grund: #000000;
    --tinte: #9A8F80;
    --tinte-leise: #7D7366;
    --faden: #E0A03A;
    --knoten: #F2C879;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--grund);
    color: var(--tinte);
    font-family: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, sans-serif;
    transition: background 200ms, color 200ms;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100%;
    padding: 24px 16px 48px;
    gap: 20px;
  }
  h1 { font-size: 20px; margin: 8px 0 0; }
  p, label { font-size: 14px; color: var(--tinte-leise); margin: 0; }
  .karte {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  fieldset {
    border: 1px solid var(--tinte-leise);
    border-radius: 8px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  legend { font-size: 14px; color: var(--tinte-leise); padding: 0 6px; }
  .zeile { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  input[type=file] { color: var(--tinte); font-size: 14px; }
  input[type=text] {
    width: 72px;
    font-size: 17px;
    padding: 8px;
    border-radius: 6px;
    border: 1px solid var(--tinte-leise);
    background: var(--grund);
    color: var(--tinte);
    text-align: center;
  }
  button {
    min-height: 56px;
    min-width: 56px;
    font-size: 17px;
    font-family: inherit;
    border-radius: 8px;
    border: 1px solid var(--faden);
    background: transparent;
    color: var(--tinte);
    padding: 10px 18px;
    cursor: pointer;
  }
  button.haupt {
    min-height: 88px;
    font-size: 20px;
    background: var(--faden);
    color: var(--grund);
    border: none;
    width: 100%;
  }
  .nacht button.haupt {
    background: transparent;
    color: var(--faden);
    border: 2px solid var(--faden);
  }
  button:disabled { opacity: 0.4; cursor: default; }
  button.klein { min-height: 44px; font-size: 14px; }

  #faden-modus {
    display: none;
    position: fixed;
    inset: 0;
    background: #000000;
    color: #9A8F80;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 24px;
    text-align: center;
    z-index: 10;
  }
  #faden-modus.aktiv { display: flex; }
  .faden-text { font-size: 20px; color: #9A8F80; }
  .faden-leise { font-size: 14px; color: #7D7366; }

  .faden-linie {
    position: relative;
    width: 100%;
    max-width: 420px;
    height: 3px;
    background: rgba(125, 115, 102, 0.4);
    border-radius: 2px;
    overflow: visible;
  }
  .faden-linie .gehoert {
    position: absolute;
    left: 0;
    top: 0;
    height: 100%;
    background: #E0A03A;
    border-radius: 2px;
    transition: width 300ms;
  }
  .faden-linie .knoten {
    position: absolute;
    top: 50%;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #F2C879;
    transform: translate(-50%, -50%);
    transition: left 300ms;
  }

  #ergebnis { display: none; flex-direction: column; gap: 14px; width: 100%; max-width: 480px; }
  #ergebnis.aktiv { display: flex; }

  #log-ausgabe {
    width: 100%;
    max-width: 480px;
    font-family: ui-monospace, monospace;
    font-size: 12px;
    white-space: pre-wrap;
    background: rgba(94, 101, 119, 0.08);
    border-radius: 8px;
    padding: 10px;
    max-height: 200px;
    overflow-y: auto;
  }

  .umschalter { font-size: 12px; }
</style>
</head>
<body>

<h1>Faden – Prototyp „Faden aufnehmen“</h1>
<p>M0: Kernidee an einem echten Hörbuch prüfen.</p>

<div class="karte">
  <fieldset>
    <legend>1. Kapitel laden</legend>
    <div class="zeile">
      <input type="file" id="datei-eingabe" accept="audio/mpeg,audio/mp3">
    </div>
    <p id="datei-status">Keine Datei geladen.</p>
    <p id="analyse-status"></p>
  </fieldset>

  <fieldset>
    <legend>2. Suchfenster (Selbsttest: mm:ss)</legend>
    <div class="zeile">
      <label for="von">von</label>
      <input type="text" id="von" value="00:00" inputmode="numeric">
      <label for="bis">bis</label>
      <input type="text" id="bis" value="30:00" inputmode="numeric">
    </div>
    <label class="umschalter">
      <input type="checkbox" id="nacht-umschalter"> Nachtfarben erzwingen
    </label>
  </fieldset>

  <button class="haupt" id="start-knopf" disabled>Faden aufnehmen</button>
  <p id="fehler-text" style="color:#B3261E;"></p>
</div>

<div id="faden-modus">
  <div class="faden-text" id="faden-hinweis">Kennst du das? Dann tippen.</div>
  <div class="faden-linie">
    <div class="gehoert" id="faden-gehoert"></div>
    <div class="knoten" id="faden-knoten"></div>
  </div>
  <div class="faden-leise" id="faden-zaehler">Probe 1 von höchstens 8</div>
</div>

<div id="ergebnis" class="karte">
  <fieldset>
    <legend>Ergebnis</legend>
    <p id="ergebnis-text">Gefunden. Weiter ab hier.</p>
    <div class="zeile">
      <button class="klein" id="abspiel-knopf">Weiter ab hier abspielen</button>
      <button class="klein" id="frueher-knopf">Früher</button>
      <button class="klein" id="ab-stopp-knopf">Ab Stopp weiterhören</button>
    </div>
  </fieldset>
  <fieldset>
    <legend>Protokoll</legend>
    <div id="log-ausgabe"></div>
    <button class="klein" id="kopier-knopf">Protokoll kopieren</button>
  </fieldset>
</div>

<audio id="haupt-player" style="display:none"></audio>
<audio id="proben-player" style="display:none"></audio>

<script>
"use strict";

/* ---------------------------------------------------------------------
 * Faden-Suche, pur, nach docs/ARCHITEKTUR.md Abschnitt 8. Wortgleich mit
 * dem Pseudocode dort, nur die "frage"-Funktion ist hier asynchron, weil
 * sie eine echte Hörprobe abspielt und auf eine Nutzer-Antwort wartet.
 * ------------------------------------------------------------------- */
const TARGET = 30_000, MAX_PROBES = 8, PROBE_LEN = 4_000, ANSWER_WINDOW = 3_000,
      FIRST_OFFSET = 25_000, PREROLL = 2_000;

function snap(x, lo, hi, tol, pausen) {
  const k = pausen.filter(s => lo + PROBE_LEN < s && s < hi - PROBE_LEN && Math.abs(s - x) <= tol);
  if (k.length === 0) return x;
  return k.reduce((best, s) => (Math.abs(s - x) < Math.abs(best - x) ? s : best));
}

// frageAsync(p, probenNr) -> Promise<boolean>
async function fadenSuche(lo, hi, pausen, frageAsync, prior = null) {
  if (hi - lo <= TARGET) return { start: Math.max(lo - PREROLL, 0), leiter: [lo] };

  const leiter = [lo];
  let proben = 0;

  if (prior === null) {
    const p = snap(hi - FIRST_OFFSET, lo, hi, 2_000, pausen);
    proben += 1;
    if (await frageAsync(p, proben)) return { start: p, leiter: [lo, p] };
    hi = p;
  }

  while (hi - lo > TARGET && proben < MAX_PROBES) {
    const x = proben === 0 && prior !== null ? prior : lo + (hi - lo) / 2;
    const tol = Math.max(2_000, 0.03 * (hi - lo));
    const p = snap(x, lo, hi, tol, pausen);
    proben += 1;
    if (await frageAsync(p, proben)) { lo = p; leiter.push(p); } else { hi = p; }
  }

  const start = lo === leiter[0] ? Math.max(lo - PREROLL, 0) : lo;
  return { start, leiter };
}

/* ---------------------------------------------------------------------
 * Satzanfang-Erkennung: Stille >= 350 ms, analog zu
 * `ffmpeg silencedetect=noise=-35dB:d=0.35` (docs/ARCHITEKTUR.md 4).
 * Dekodiert mit niedriger Abtastrate (spart Speicher bei langen Dateien),
 * läuft dann mit gefensterter RMS-Analyse über die Samples.
 * ------------------------------------------------------------------- */
const ANALYSE_SAMPLERATE = 6000;
const SILENCE_DB = -35;
const SILENCE_S = 0.35;
const FRAME_MS = 20;

async function erkennePausen(arrayBuffer) {
  const AC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  if (!AC) throw new Error("OfflineAudioContext nicht verfügbar");
  // Länge grob schätzen (1s Platzhalter reicht für decodeAudioData selbst,
  // die tatsächliche Länge ergibt sich aus dem dekodierten Buffer).
  const platzhalter = new AC(1, ANALYSE_SAMPLERATE, ANALYSE_SAMPLERATE);
  const buffer = await platzhalter.decodeAudioData(arrayBuffer.slice(0));
  const samples = buffer.getChannelData(0);
  const sr = buffer.sampleRate;
  const frameLen = Math.max(1, Math.round(sr * FRAME_MS / 1000));
  const schwelle = Math.pow(10, SILENCE_DB / 20);
  const minFrames = Math.ceil(SILENCE_S * 1000 / FRAME_MS);

  const pausen = [0];
  let stilleFrames = 0;
  let inStille = false;

  for (let i = 0; i < samples.length; i += frameLen) {
    let summe = 0, n = 0;
    for (let j = i; j < Math.min(i + frameLen, samples.length); j++, n++) summe += samples[j] * samples[j];
    const rms = n > 0 ? Math.sqrt(summe / n) : 0;
    const stumm = rms < schwelle;

    if (stumm) {
      stilleFrames++;
      inStille = true;
    } else {
      if (inStille && stilleFrames >= minFrames) {
        const endeMs = Math.round((i / sr) * 1000);
        pausen.push(endeMs);
      }
      stilleFrames = 0;
      inStille = false;
    }
  }
  return pausen;
}

/* ---------------------------------------------------------------------
 * UI-Verdrahtung
 * ------------------------------------------------------------------- */
const $ = (id) => document.getElementById(id);
const dateiEingabe = $("datei-eingabe");
const dateiStatus = $("datei-status");
const analyseStatus = $("analyse-status");
const startKnopf = $("start-knopf");
const vonFeld = $("von");
const bisFeld = $("bis");
const fehlerText = $("fehler-text");
const nachtUmschalter = $("nacht-umschalter");
const fadenModus = $("faden-modus");
const fadenHinweis = $("faden-hinweis");
const fadenGehoert = $("faden-gehoert");
const fadenKnoten = $("faden-knoten");
const fadenZaehler = $("faden-zaehler");
const ergebnisBlock = $("ergebnis");
const ergebnisText = $("ergebnis-text");
const abspielKnopf = $("abspiel-knopf");
const frueherKnopf = $("frueher-knopf");
const abStoppKnopf = $("ab-stopp-knopf");
const logAusgabe = $("log-ausgabe");
const kopierKnopf = $("kopier-knopf");
const hauptPlayer = $("haupt-player");
const probenPlayer = $("proben-player");

let objektUrl = null;
let pausen = [];
let protokoll = [];
let ladeBeginn = 0;
let letztesErgebnis = null; // { leiter, start, stop }
let leiterIndex = 0;

function mmssZuMs(text) {
  const teil = text.trim().split(":");
  if (teil.length !== 2) return null;
  const min = parseInt(teil[0], 10);
  const sek = parseInt(teil[1], 10);
  if (Number.isNaN(min) || Number.isNaN(sek) || sek < 0 || sek > 59 || min < 0) return null;
  return (min * 60 + sek) * 1000;
}

function msZuMmss(ms) {
  const gesamtSek = Math.round(ms / 1000);
  const min = Math.floor(gesamtSek / 60);
  const sek = gesamtSek % 60;
  return `${min}:${String(sek).padStart(2, "0")}`;
}

dateiEingabe.addEventListener("change", async () => {
  fehlerText.textContent = "";
  startKnopf.disabled = true;
  const datei = dateiEingabe.files[0];
  if (!datei) return;

  if (objektUrl) URL.revokeObjectURL(objektUrl);
  objektUrl = URL.createObjectURL(datei);
  hauptPlayer.src = objektUrl;
  probenPlayer.src = objektUrl;
  dateiStatus.textContent = `Geladen: ${datei.name}`;
  analyseStatus.textContent = "Analysiere Satzanfänge …";
  pausen = [];

  try {
    const buf = await datei.arrayBuffer();
    pausen = await erkennePausen(buf);
    analyseStatus.textContent = `${pausen.length - 1} Satzanfänge erkannt (Stille ≥ ${SILENCE_S * 1000} ms).`;
  } catch (e) {
    // Scheitert die Erkennung: ohne Einrasten weiter (leere Pausenliste).
    pausen = [];
    analyseStatus.textContent = "Erkennung nicht möglich, Suche läuft ohne Einrasten weiter.";
  }
  startKnopf.disabled = false;
});

nachtUmschalter.addEventListener("change", () => {
  document.body.classList.toggle("nacht", nachtUmschalter.checked);
});

function protokolliere(eintrag) {
  protokoll.push(eintrag);
  logAusgabe.textContent = protokoll.map(e => JSON.stringify(e)).join("\n");
}

function spieleProbeAb(startMs) {
  return new Promise((resolve) => {
    probenPlayer.currentTime = startMs / 1000;
    probenPlayer.play().catch(() => {});
    const stopUhr = setTimeout(() => {
      probenPlayer.pause();
    }, PROBE_LEN);
    resolve(stopUhr);
  });
}

// Wartet auf Leertaste, Tipp auf den Screen oder Mediataste.
// Keine Antwort binnen probe_len + answer_window ab Probenbeginn -> "kenne ich nicht".
function wartAufAntwort(gesamtFensterMs) {
  return new Promise((resolve) => {
    let entschieden = false;
    const beenden = (antwort) => {
      if (entschieden) return;
      entschieden = true;
      window.removeEventListener("keydown", tastenHoerer);
      fadenModus.removeEventListener("click", klickHoerer);
      clearTimeout(zeitUhr);
      if ("mediaSession" in navigator) {
        try {
          navigator.mediaSession.setActionHandler("play", null);
          navigator.mediaSession.setActionHandler("pause", null);
          navigator.mediaSession.setActionHandler("nexttrack", null);
          navigator.mediaSession.setActionHandler("previoustrack", null);
        } catch (e) { /* manche Browser kennen nicht alle Actions */ }
      }
      resolve(antwort);
    };
    const tastenHoerer = (ev) => { if (ev.code === "Space") { ev.preventDefault(); beenden(true); } };
    const klickHoerer = () => beenden(true);

    window.addEventListener("keydown", tastenHoerer);
    fadenModus.addEventListener("click", klickHoerer);
    if ("mediaSession" in navigator) {
      try {
        navigator.mediaSession.setActionHandler("play", () => beenden(true));
        navigator.mediaSession.setActionHandler("pause", () => beenden(true));
        navigator.mediaSession.setActionHandler("nexttrack", () => beenden(true));
        navigator.mediaSession.setActionHandler("previoustrack", () => beenden(true));
      } catch (e) { /* ignorieren, wenn Actions nicht unterstützt werden */ }
    }
    const zeitUhr = setTimeout(() => beenden(false), gesamtFensterMs);
  });
}

function faedenBreite(p, lo, hi) {
  if (hi <= lo) return 0;
  return Math.min(100, Math.max(0, ((p - lo) / (hi - lo)) * 100));
}

async function frage(p, probenNr, lo, hi) {
  fadenZaehler.textContent = `Probe ${probenNr} von höchstens ${MAX_PROBES}`;
  fadenHinweis.textContent = "Kennst du das? Dann tippen.";
  const breite = faedenBreite(p, lo, hi);
  fadenGehoert.style.width = breite + "%";
  fadenKnoten.style.left = breite + "%";

  await spieleProbeAb(p);
  const antwort = await wartAufAntwort(PROBE_LEN + ANSWER_WINDOW);
  probenPlayer.pause();
  protokolliere({ probe: probenNr, position_ms: p, antwort: antwort ? "kenne ich" : "kenne ich nicht" });
  return antwort;
}

startKnopf.addEventListener("click", async () => {
  fehlerText.textContent = "";
  const lo = mmssZuMs(vonFeld.value);
  const hi = mmssZuMs(bisFeld.value);
  if (lo === null || hi === null || hi <= lo) {
    fehlerText.textContent = "Fenster ungültig: „von“ muss vor „bis“ liegen (mm:ss).";
    return;
  }

  protokoll = [];
  ladeBeginn = performance.now();
  ergebnisBlock.classList.remove("aktiv");
  fadenModus.classList.add("aktiv");

  const { start, leiter } = await fadenSuche(lo, hi, pausen, (p, n) => frage(p, n, lo, hi));

  fadenModus.classList.remove("aktiv");
  const dauerS = Math.round((performance.now() - ladeBeginn) / 1000);
  protokolliere({ ergebnis_start_ms: start, leiter, gesamtdauer_s: dauerS });

  letztesErgebnis = { leiter, start, stop: hi };
  leiterIndex = leiter.length - 1;
  zeigeErgebnis(start);
});

function zeigeErgebnis(startMs) {
  ergebnisText.textContent = `Gefunden. Weiter ab hier. (${msZuMmss(startMs)})`;
  ergebnisBlock.classList.add("aktiv");
}

abspielKnopf.addEventListener("click", () => {
  if (!letztesErgebnis) return;
  hauptPlayer.currentTime = letztesErgebnis.leiter[leiterIndex] / 1000;
  hauptPlayer.play().catch(() => {});
});

frueherKnopf.addEventListener("click", () => {
  if (!letztesErgebnis) return;
  if (leiterIndex > 0) leiterIndex -= 1;
  const pos = leiterIndex === 0
    ? Math.max(letztesErgebnis.leiter[0] - PREROLL, 0)
    : letztesErgebnis.leiter[leiterIndex];
  zeigeErgebnis(pos);
  protokolliere({ frueher: true, leiter_index: leiterIndex, position_ms: pos });
});

abStoppKnopf.addEventListener("click", () => {
  if (!letztesErgebnis) return;
  hauptPlayer.currentTime = letztesErgebnis.stop / 1000;
  hauptPlayer.play().catch(() => {});
  protokolliere({ ab_stopp_weiterhoeren: true, position_ms: letztesErgebnis.stop });
});

kopierKnopf.addEventListener("click", async () => {
  const text = protokoll.map(e => JSON.stringify(e)).join("\n");
  try {
    await navigator.clipboard.writeText(text);
    kopierKnopf.textContent = "Kopiert.";
    setTimeout(() => { kopierKnopf.textContent = "Protokoll kopieren"; }, 1500);
  } catch (e) {
    fehlerText.textContent = "Kopieren nicht möglich, bitte Text manuell markieren.";
  }
});
</script>
</body>
</html>
