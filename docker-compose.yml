services:
  faden:
    build: ./server
    # Must be able to read the audiobook share; set FADEN_UID/FADEN_GID in .env
    # to the NAS user that owns it (like paperless' USERMAP_UID/USERMAP_GID).
    user: "${FADEN_UID:-10001}:${FADEN_GID:-10001}"
    ports:
      - "${FADEN_PORT:-8787}:8787"
    env_file: .env
    volumes:
      # Read-only. Can be a broader root than the actual audiobook folder
      # (e.g. a whole NAS share); pick the real subfolder at /setup, or via
      # settings.library_path directly (see docs/ARCHITEKTUR.md sections
      # 10, 12, decision E12).
      - ${FADEN_LIBRARY_HOST:-./library}:/library:ro
      - faden-data:/data
    restart: unless-stopped

volumes:
  faden-data:
