[project]
name = "faden-server"
version = "0.1.0"
description = "Faden server: import, manifests, files, events"
authors = [
    { name = "Claude", email = "noreply@anthropic.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "mutagen>=1.48.1",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
faden-server = "faden_server:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
markers = ["slow: slower integration tests (ffmpeg/ffprobe heavy)"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection relies on calling Depends() in argument
# defaults; that is the documented pattern, not a mutable-default bug.
extend-immutable-calls = ["fastapi.Depends"]
